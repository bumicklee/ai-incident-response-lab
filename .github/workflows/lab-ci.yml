name: Lab checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r oncall/requirements-test.txt
      - run: python -m unittest discover -s oncall -p test_app.py -v
      - run: python -m unittest discover -s tools -p test_local_analysis_worker.py -v

  java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: spring/pom.xml
      - run: mvn -B -q -f spring/secure-kit-spring/pom.xml install -DskipTests   # 쇼핑몰이 쓰는 secure-kit을 먼저 로컬 Maven 저장소에 설치(Dockerfile.portal과 같은 순서)
      - run: mvn -B -q -f spring/pom.xml -pl mall-portal -am -DskipTests -Ddocker.skip=true package
      - name: Price fix regression tests when patch is present
        run: |
          if test -f spring/mall-portal/src/test/java/com/macro/mall/portal/LocalPriceFixTest.java; then
            mvn -B -q -f spring/pom.xml -pl mall-portal -am -Dtest=LocalPriceFixTest -Dsurefire.failIfNoSpecifiedTests=false -DskipTests=false -Ddocker.skip=true test
          else
            echo "Price fix patch is not on this branch; Java compile completed."
          fi
