# Optional second log source for the two-source security-correlation lesson.
# Start only after all five baseline runs: it changes the measurement load.
services:
  gateway:
    image: nginx:1.30.6-alpine
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:${LAB_GATEWAY_PORT:-18086}:8080"]
    depends_on: [mall-portal]
    mem_limit: 96m
    networks: [default]
