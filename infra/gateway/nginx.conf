worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    log_format lab_json escape=json '{"source":"gateway","ts":"$time_iso8601",'
        '"method":"$request_method","path":"$uri","http_status":$status,'
        '"trace_id":"$upstream_http_x_trace_id","client_ip":"$remote_addr"}';
    access_log /dev/stdout lab_json;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 2m;

        location / {
            proxy_pass http://mall-portal:8085;
            proxy_set_header Host $host;
            proxy_set_header X-Trace-Id $http_x_trace_id;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
